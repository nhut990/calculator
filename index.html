<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <title>Máy tính</title>

  <style>
    /* ---------- GIỮ NGUYÊN CSS CŨ (không thay đổi) ---------- */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: #162235;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      padding:
        max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
      background: #162235;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    .app {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    .calculator,
    .history-box {
      width: 100%;
      background: #ffffff;
      border-radius: clamp(16px, 5vw, 26px);
      padding: clamp(12px, 4vw, 20px);
    }

    .calculator {
      margin-bottom: 10px;
    }

    .display {
      width: 100%;
      height: clamp(72px, 17vw, 115px);
      margin-bottom: clamp(10px, 3vw, 16px);
      padding: 12px 16px;
      border: none;
      border-radius: clamp(14px, 4vw, 20px);
      background: #e7e9ee;
      color: #111827;
      text-align: right;
      font-size: clamp(34px, 11vw, 52px);
      outline: none;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(8px, 2.8vw, 14px);
    }

    button {
      width: 100%;
      height: clamp(52px, 16vw, 82px);
      border: none;
      border-radius: clamp(12px, 4vw, 18px);
      background: #e7e9ee;
      color: #111827;
      font-size: clamp(24px, 8vw, 35px);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      transition:
        background-color 0.16s ease,
        color 0.16s ease,
        transform 0.12s ease,
        box-shadow 0.16s ease;
    }

    button:hover {
      background: #dce1e9;
    }

    button:active,
    button.is-pressed {
      background: #cbd3df;
      transform: scale(0.94);
      box-shadow: inset 0 2px 6px rgba(17, 24, 39, 0.18);
    }

    .operator {
      background: #f99d00;
      color: white;
    }

    .operator:hover {
      background: #e99000;
    }

    .operator:active,
    .operator.is-pressed {
      background: #d98200;
      color: #fff8ed;
      box-shadow: inset 0 2px 6px rgba(120, 64, 0, 0.28);
    }

    .clear {
      background: #ff4248;
      color: white;
    }

    .clear:hover {
      background: #ec353b;
    }

    .clear:active,
    .clear.is-pressed {
      background: #d92d33;
      color: #fff5f5;
      box-shadow: inset 0 2px 6px rgba(120, 0, 0, 0.28);
    }

    .equal {
      background: #10b981;
      color: white;
    }

    .equal:hover {
      background: #0ea572;
    }

    .equal:active,
    .equal.is-pressed {
      background: #098b60;
      color: #effff8;
      box-shadow: inset 0 2px 6px rgba(0, 88, 57, 0.28);
    }

    .zero {
      grid-column: span 2;
    }

    .history-box {
      margin-bottom: 10px;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .history-header h2 {
      margin: 0;
      color: #111827;
      font-size: clamp(18px, 5vw, 23px);
    }

    .clear-history {
      width: auto;
      height: auto;
      padding: 9px 11px;
      border-radius: 10px;
      background: #6b7280;
      color: white;
      font-size: clamp(12px, 3.5vw, 14px);
      white-space: nowrap;
    }

    .clear-history:hover {
      background: #59616f;
    }

    .clear-history:active,
    .clear-history.is-pressed {
      background: #4b5563;
      color: #f9fafb;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    .history-item {
      padding: 11px 2px;
      border-bottom: 1px solid #e5e7eb;
      color: #4b5563;
      font-size: clamp(15px, 4.5vw, 18px);
      word-break: break-word;
      cursor: pointer;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-item strong {
      display: block;
      margin-top: 4px;
      color: #111827;
      font-size: clamp(17px, 5vw, 21px);
    }

    .empty-history {
      margin: 0;
      color: #9ca3af;
      font-size: 15px;
    }

    .show-more-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 14px;
      background: #e5e7eb;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      color: #1f2937;
      cursor: pointer;
      transition: background 0.2s;
    }

    .show-more-btn:hover {
      background: #d1d5db;
    }

    .show-more-btn:active {
      background: #b0b8c4;
    }

    @media (max-width: 350px) {
      body {
        padding: 6px 6px 18px;
      }

      .calculator,
      .history-box {
        padding: 11px;
      }

      .display {
        height: 68px;
        font-size: 32px;
      }

      button {
        height: 50px;
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="calculator">
      <input id="display" class="display" type="text" value="0" readonly />

      <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="deleteLast()">⌫</button>
        <button class="operator" onclick="appendValue('%')">%</button>
        <button class="operator" onclick="appendValue(':')">:</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('x')">x</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('-')">−</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button class="zero" onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
      </div>
    </section>

    <section class="history-box">
      <div class="history-header">
        <h2>Lịch sử</h2>
        <button class="clear-history" onclick="clearHistory()">Xóa lịch sử</button>
      </div>

      <div id="history">
        <p class="empty-history">Chưa có phép tính nào.</p>
      </div>
    </section>
  </main>

  <script>
    const display = document.getElementById("display");
    const historyBox = document.getElementById("history");
    let history = [];
    let showAllHistory = false;

    const operators = ['+', '-', 'x', ':', '%'];

    // ---------- Định dạng số (sửa lỗi dấu chấm cuối) ----------
    function formatNumber(num) {
      if (typeof num !== 'number' || !isFinite(num)) return String(num);
      // Dùng toFixed(10) để có đủ chữ số thập phân, sau đó bỏ số 0 vô nghĩa
      const parts = num.toFixed(10).split('.');
      const intPart = parts[0];
      let decPart = parts[1] ? parts[1].replace(/0+$/, '') : ''; // bỏ 0 cuối
      const formattedInt = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      // Nếu còn phần thập phân thì thêm dấu chấm, ngược lại chỉ trả về phần nguyên
      return decPart ? formattedInt + '.' + decPart : formattedInt;
    }

    // ---------- Xử lý % theo logic máy tính ----------
    function processPercent(expr) {
      let newExpr = expr;
      let maxLoop = 50;
      while (newExpr.includes('%') && maxLoop-- > 0) {
        const idx = newExpr.indexOf('%');
        if (idx === -1) break;

        let numStart = idx - 1;
        while (numStart >= 0 && /[\d.]/.test(newExpr[numStart])) numStart--;
        const numStr = newExpr.substring(numStart + 1, idx);
        if (!numStr) break;

        let opIdx = numStart;
        while (opIdx >= 0 && /\s/.test(newExpr[opIdx])) opIdx--;
        if (opIdx < 0) {
          const replaced = '(' + numStr + '/100)';
          newExpr = newExpr.substring(0, numStart + 1) + replaced + newExpr.substring(idx + 1);
          continue;
        }
        const opChar = newExpr[opIdx];
        if (!['+', '-', '*', '/'].includes(opChar)) {
          const replaced = '(' + numStr + '/100)';
          newExpr = newExpr.substring(0, numStart + 1) + replaced + newExpr.substring(idx + 1);
          continue;
        }

        let leftStart = opIdx - 1;
        while (leftStart >= 0 && /[\d.]/.test(newExpr[leftStart])) leftStart--;
        const leftNumStr = newExpr.substring(leftStart + 1, opIdx);
        if (!leftNumStr) {
          const replaced = '(' + numStr + '/100)';
          newExpr = newExpr.substring(0, numStart + 1) + replaced + newExpr.substring(idx + 1);
          continue;
        }

        let replacement = '';
        if (opChar === '+' || opChar === '-') {
          replacement = '(' + leftNumStr + ' + ' + leftNumStr + '*' + numStr + '/100)';
        } else if (opChar === '*' || opChar === '/') {
          replacement = '(' + leftNumStr + ' * (' + numStr + '/100))';
        } else {
          replacement = '(' + numStr + '/100)';
        }

        newExpr = newExpr.substring(0, leftStart + 1) + replacement + newExpr.substring(idx + 1);
      }
      newExpr = newExpr.replace(/%/g, '/100');
      return newExpr;
    }

    // ---------- Các hàm nhập liệu ----------
    function appendValue(value) {
      if (display.value === 'Lỗi') display.value = '';
      if (display.value === '0') {
        if (operators.includes(value)) return;
        if (value === '.') { display.value = '0.'; return; }
        display.value = '';
      }
      if (value === '.') {
        const parts = display.value.split(/[\+\-\*\/x:%]/);
        const lastPart = parts[parts.length - 1];
        if (lastPart.includes('.')) return;
      }
      if (operators.includes(value)) {
        const lastChar = display.value.slice(-1);
        if (operators.includes(lastChar)) {
          display.value = display.value.slice(0, -1) + value;
          return;
        }
        if (display.value === '' || display.value === '0') return;
      }
      display.value += value;
    }

    function clearDisplay() {
      display.value = "0";
    }

    function deleteLast() {
      if (display.value === "Lỗi") { display.value = "0"; return; }
      display.value = display.value.slice(0, -1) || "0";
    }

    // ---------- Tính toán ----------
    function calculate() {
      try {
        const expression = display.value;
        if (!/^[0-9+\-x:%(). ]+$/.test(expression)) throw new Error("Invalid characters");

        let processed = processPercent(expression);
        processed = processed.replaceAll('x', '*').replaceAll(':', '/');

        let result = eval(processed);
        if (!Number.isFinite(result)) throw new Error("Invalid result");

        const roundedResult = parseFloat(result.toPrecision(12));
        history.unshift({ expression: expression, result: roundedResult });

        display.value = formatNumber(roundedResult);
        renderHistory();
      } catch (error) {
        display.value = "Lỗi";
        console.warn("Calculation error:", error.message);
      }
    }

    // ---------- Lịch sử (giới hạn 3, có nút xem thêm) ----------
    function renderHistory() {
      if (history.length === 0) {
        historyBox.innerHTML = '<p class="empty-history">Chưa có phép tính nào.</p>';
        return;
      }

      const total = history.length;
      const showCount = showAllHistory ? total : Math.min(total, 3);
      const itemsToShow = history.slice(0, showCount);

      let html = '';
      itemsToShow.forEach((item, index) => {
        const formattedResult = formatNumber(item.result);
        html += `
          <div class="history-item" data-index="${index}">
            <div>${item.expression}</div>
            <strong>= ${formattedResult}</strong>
          </div>
        `;
      });

      if (total > 3) {
        const label = showAllHistory ? 'Thu gọn' : 'Xem thêm';
        html += `<button class="show-more-btn" onclick="toggleHistory()">${label}</button>`;
      }

      historyBox.innerHTML = html;

      document.querySelectorAll('.history-item').forEach((el) => {
        const idx = parseInt(el.dataset.index, 10);
        el.addEventListener('click', () => {
          display.value = history[idx].expression;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    }

    function toggleHistory() {
      showAllHistory = !showAllHistory;
      renderHistory();
    }

    function clearHistory() {
      history = [];
      showAllHistory = false;
      renderHistory();
    }

    // ---------- Hiệu ứng nhấn nút ----------
    document.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        btn.classList.remove("is-pressed");
        requestAnimationFrame(() => {
          btn.classList.add("is-pressed");
          setTimeout(() => btn.classList.remove("is-pressed"), 180);
        });
      });
    });

    // ---------- Phím tắt ----------
    document.addEventListener("keydown", function (e) {
      const key = e.key;
      if ("0123456789+-%.()".includes(key)) appendValue(key);
      else if (key === "*" || key === "x" || key === "X") appendValue("x");
      else if (key === "/" || key === ":") appendValue(":");
      else if (key === "Enter" || key === "=") { e.preventDefault(); calculate(); }
      else if (key === "Backspace") deleteLast();
      else if (key === "Escape") clearDisplay();
    });

    document.addEventListener("dblclick", (e) => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
