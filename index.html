<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <title>Máy tính</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: #162235;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      padding:
        max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
      background: #162235;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    .app {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    .calculator,
    .history-box {
      width: 100%;
      background: #ffffff;
      border-radius: clamp(16px, 5vw, 26px);
      padding: clamp(12px, 4vw, 20px);
    }

    .calculator {
      margin-bottom: 10px;
    }

    .display-wrapper {
      position: relative;
      width: 100%;
      height: clamp(72px, 17vw, 115px);
      margin-bottom: clamp(10px, 3vw, 16px);
    }

    .display {
      width: 100%;
      height: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: clamp(14px, 4vw, 20px);
      background: #e7e9ee;
      color: #111827;
      text-align: right;
      font-size: clamp(30px, 9.5vw, 52px);
      outline: none;
      overflow: hidden;
      white-space: nowrap;
    }

    .display-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      padding: 12px 16px;
      pointer-events: none;
      color: #b0b8c4;
      font-size: clamp(16px, 4vw, 24px);
      font-style: italic;
      font-weight: 300;
      text-align: left;
      display: flex;
      align-items: center;
      transition: opacity 0.2s ease;
      opacity: 0;
      border-radius: clamp(14px, 4vw, 20px);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .display-placeholder.show {
      opacity: 1;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(8px, 2.8vw, 14px);
    }

    button {
      width: 100%;
      height: clamp(48px, 14.5vw, 76px);
      border: 1.5px solid #b8c1ce;
      border-radius: clamp(12px, 4vw, 18px);
      background: linear-gradient(145deg, #f4f6f9, #dce2ea);
      color: #111827;
      font-size: clamp(22px, 7.2vw, 32px);
      font-weight: 500;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      box-shadow:
        0 3px 7px rgba(15, 23, 42, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
      transition:
        background-color 0.16s ease,
        color 0.16s ease,
        transform 0.12s ease,
        box-shadow 0.16s ease,
        border-color 0.16s ease;
    }

    button:hover {
      background: linear-gradient(145deg, #ffffff, #d7dee8);
      border-color: #8f9bab;
      box-shadow:
        0 5px 11px rgba(15, 23, 42, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    button:active,
    button.is-pressed {
      background: linear-gradient(145deg, #d4dbe5, #edf1f5);
      border-color: #8491a2;
      transform: scale(0.94);
      box-shadow:
        inset 0 3px 7px rgba(17, 24, 39, 0.2),
        0 1px 2px rgba(255, 255, 255, 0.7);
    }

    .operator {
      background: linear-gradient(145deg, #ffb126, #e48600);
      border-color: #c87100;
      color: white;
      box-shadow:
        0 3px 8px rgba(170, 94, 0, 0.26),
        inset 0 1px 0 rgba(255, 238, 197, 0.55);
    }

    .operator:hover {
      background: linear-gradient(145deg, #ffc04b, #df7f00);
      border-color: #ad6300;
      box-shadow:
        0 5px 12px rgba(170, 94, 0, 0.3),
        inset 0 1px 0 rgba(255, 244, 215, 0.6);
    }

    .operator:active,
    .operator.is-pressed {
      background: linear-gradient(145deg, #d87900, #f39a08);
      border-color: #9d5900;
      color: #fff8ed;
      box-shadow:
        inset 0 3px 7px rgba(120, 64, 0, 0.32),
        0 1px 2px rgba(255, 229, 177, 0.5);
    }

    .clear {
      background: linear-gradient(145deg, #ff6066, #e72e36);
      border-color: #bd2028;
      color: white;
      box-shadow:
        0 3px 8px rgba(160, 20, 28, 0.25),
        inset 0 1px 0 rgba(255, 220, 220, 0.5);
    }

    .clear:hover {
      background: linear-gradient(145deg, #ff777c, #df2830);
      border-color: #a91a21;
      box-shadow:
        0 5px 12px rgba(160, 20, 28, 0.3),
        inset 0 1px 0 rgba(255, 228, 228, 0.58);
    }

    .clear:active,
    .clear.is-pressed {
      background: linear-gradient(145deg, #d5252d, #f24950);
      border-color: #94171d;
      color: #fff5f5;
      box-shadow:
        inset 0 3px 7px rgba(120, 0, 0, 0.32),
        0 1px 2px rgba(255, 205, 205, 0.45);
    }

    .equal {
      background: linear-gradient(145deg, #2acb96, #079568);
      border-color: #057955;
      color: white;
      box-shadow:
        0 3px 8px rgba(0, 110, 73, 0.25),
        inset 0 1px 0 rgba(207, 255, 239, 0.48);
    }

    .equal:hover {
      background: linear-gradient(145deg, #4bddad, #078a61);
      border-color: #056b4d;
      box-shadow:
        0 5px 12px rgba(0, 110, 73, 0.3),
        inset 0 1px 0 rgba(221, 255, 243, 0.56);
    }

    .equal:active,
    .equal.is-pressed {
      background: linear-gradient(145deg, #07835c, #1db984);
      border-color: #046044;
      color: #effff8;
      box-shadow:
        inset 0 3px 7px rgba(0, 88, 57, 0.34),
        0 1px 2px rgba(190, 255, 229, 0.45);
    }

    .zero {
      grid-column: span 2;
    }

    .equal-wide {
      grid-column: span 4;
    }

    .history-box {
      margin-bottom: 10px;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .history-header h2 {
      margin: 0;
      color: #111827;
      font-size: clamp(18px, 5vw, 23px);
    }

    .clear-history {
      width: auto;
      height: auto;
      padding: 9px 11px;
      border: 1.5px solid #4b5563;
      border-radius: 10px;
      background: linear-gradient(145deg, #7c8796, #58616e);
      color: white;
      font-size: clamp(12px, 3.5vw, 14px);
      white-space: nowrap;
      cursor: pointer;
      box-shadow:
        0 2px 5px rgba(17, 24, 39, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }

    .clear-history:hover {
      background: linear-gradient(145deg, #8b96a5, #4f5865);
      border-color: #374151;
    }

    .clear-history:active,
    .clear-history.is-pressed {
      background: linear-gradient(145deg, #4b5563, #667180);
      border-color: #303946;
      color: #f9fafb;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.28);
    }

    .history-item {
      padding: 11px 2px;
      border-bottom: 1px solid #e5e7eb;
      color: #4b5563;
      font-size: clamp(15px, 4.5vw, 18px);
      word-break: break-word;
      cursor: pointer;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-item strong {
      display: block;
      margin-top: 4px;
      color: #111827;
      font-size: clamp(17px, 5vw, 21px);
    }

    .empty-history {
      margin: 0;
      color: #9ca3af;
      font-size: 15px;
    }

    .show-more-btn {
      display: inline-block;
      width: auto;
      height: auto;
      margin-top: 10px;
      padding: 7px 15px;
      border: 1.5px solid #bcc5d0;
      border-radius: 20px;
      background: linear-gradient(145deg, #f5f7fa, #d9dfe7);
      color: #1f2937;
      font-size: 14px;
      cursor: pointer;
      box-shadow:
        0 2px 5px rgba(15, 23, 42, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .show-more-btn:hover {
      background: linear-gradient(145deg, #ffffff, #d0d7e0);
      border-color: #9ea9b7;
    }

    .show-more-btn:active {
      background: linear-gradient(145deg, #cbd3df, #e6ebf0);
      border-color: #8e9baa;
      box-shadow: inset 0 2px 5px rgba(17, 24, 39, 0.16);
    }

    .total-display {
      display: block;
      margin-bottom: 10px;
      padding: 10px 16px;
      background: #fef2f2;
      border-radius: 12px;
      color: #dc2626;
      font-weight: bold;
      font-size: clamp(18px, 5vw, 24px);
      text-align: right;
      border: 1px solid #fecaca;
    }

    @media (max-width: 350px) {
      body {
        padding: 6px 6px 18px;
      }

      .calculator,
      .history-box {
        padding: 11px;
      }

      .display-wrapper {
        height: 68px;
      }

      .display {
        font-size: 28px;
      }

      .display-placeholder {
        font-size: 14px;
      }

      button {
        height: 46px;
        font-size: 20px;
      }

      .total-display {
        font-size: 16px;
        padding: 8px 12px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="calculator">
      <div class="display-wrapper">
        <input id="display" class="display" type="text" value="0" readonly />
        <span id="displayPlaceholder" class="display-placeholder show">Created by Minh Nhựt</span>
      </div>

      <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="deleteLast()">⌫</button>
        <button class="operator" onclick="appendValue('%')">%</button>
        <button class="operator" onclick="appendValue(':')">:</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('x')">x</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('-')">−</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button onclick="toggleSign()">+/-</button>
        <button class="zero" onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>

        <button class="equal equal-wide" onclick="calculate()">=</button>
      </div>
    </section>

    <section class="history-box">
      <div class="history-header">
        <h2>Lịch sử</h2>
        <button class="clear-history" onclick="clearHistory()">Xóa lịch sử</button>
      </div>

      <div id="totalDisplay" class="total-display">
        Tổng: <span id="totalValue">0</span>
      </div>

      <div id="history">
        <p class="empty-history">Chưa có phép tính nào.</p>
      </div>
    </section>
  </main>

  <script>
    const display = document.getElementById("display");
    const placeholder = document.getElementById("displayPlaceholder");
    const historyBox = document.getElementById("history");
    const totalValue = document.getElementById("totalValue");

    let history = [];
    let showAllHistory = false;
    let justCalculated = false; // true khi kết quả trên màn hình vừa được tính xong, chưa có nhập mới
    const operators = ["+", "-", "x", ":", "%"];

    function updatePlaceholder() {
      if (display.value === "0") {
        placeholder.classList.add("show");
      } else {
        placeholder.classList.remove("show");
      }
    }

    function setDisplayValue(val) {
      display.value = val;
      display.scrollLeft = display.scrollWidth;
      updatePlaceholder();
    }

    function updateTotal() {
      if (history.length === 0) {
        totalValue.textContent = "0";
      } else {
        const total = history.reduce((sum, item) => sum + item.result, 0);
        totalValue.textContent = formatNumber(total);
      }
    }

    function formatNumber(num) {
      if (typeof num !== "number" || !isFinite(num)) return String(num);

      const parts = num.toFixed(10).split(".");
      const intPart = parts[0];
      let decPart = parts[1] ? parts[1].replace(/0+$/, "") : "";
      const formattedInt = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ".");

      return decPart ? formattedInt + "." + decPart : formattedInt;
    }

    function processPercent(expr) {
      let newExpr = expr;
      let maxLoop = 50;

      while (newExpr.includes("%") && maxLoop-- > 0) {
        const idx = newExpr.indexOf("%");
        if (idx === -1) break;

        let numStart = idx - 1;

        while (numStart >= 0 && /[\d.]/.test(newExpr[numStart])) {
          numStart--;
        }

        const numStr = newExpr.substring(numStart + 1, idx);

        if (!numStr) break;

        let opIdx = numStart;

        while (opIdx >= 0 && /\s/.test(newExpr[opIdx])) {
          opIdx--;
        }

        if (opIdx < 0) {
          const replaced = "(" + numStr + "/100)";
          newExpr =
            newExpr.substring(0, numStart + 1) +
            replaced +
            newExpr.substring(idx + 1);
          continue;
        }

        const opChar = newExpr[opIdx];

        if (!["+", "-", "*", "/"].includes(opChar)) {
          const replaced = "(" + numStr + "/100)";
          newExpr =
            newExpr.substring(0, numStart + 1) +
            replaced +
            newExpr.substring(idx + 1);
          continue;
        }

        let leftStart = opIdx - 1;

        while (leftStart >= 0 && /[\d.]/.test(newExpr[leftStart])) {
          leftStart--;
        }

        const leftNumStr = newExpr.substring(leftStart + 1, opIdx);

        if (!leftNumStr) {
          const replaced = "(" + numStr + "/100)";
          newExpr =
            newExpr.substring(0, numStart + 1) +
            replaced +
            newExpr.substring(idx + 1);
          continue;
        }

        let replacement = "";

        // ĐÃ SỬA: trước đây nhánh "+" và "-" dùng chung công thức cộng,
        // khiến "10-5%" tính sai thành 10 + 10*5/100 thay vì 10 - 10*5/100.
        if (opChar === "+") {
          replacement =
            "(" + leftNumStr + " + " + leftNumStr + "*" + numStr + "/100)";
        } else if (opChar === "-") {
          replacement =
            "(" + leftNumStr + " - " + leftNumStr + "*" + numStr + "/100)";
        } else if (opChar === "*" || opChar === "/") {
          replacement = "(" + leftNumStr + " * (" + numStr + "/100))";
        } else {
          replacement = "(" + numStr + "/100)";
        }

        newExpr =
          newExpr.substring(0, leftStart + 1) +
          replacement +
          newExpr.substring(idx + 1);
      }

      newExpr = newExpr.replace(/%/g, "/100");
      return newExpr;
    }

    function appendValue(value) {
      justCalculated = false;

      let current = display.value;

      if (current === "Lỗi") current = "";

      if (current === "0") {
        if (operators.includes(value)) return;

        if (value === ".") {
          setDisplayValue("0.");
          return;
        }

        setDisplayValue(value);
        return;
      }

      if (value === ".") {
        const parts = current.split(/[\+\-\*\/x:%]/);
        const lastPart = parts[parts.length - 1];

        if (lastPart.includes(".")) return;
      }

      if (operators.includes(value)) {
        const lastChar = current.slice(-1);

        if (operators.includes(lastChar)) {
          current = current.slice(0, -1) + value;
          setDisplayValue(current);
          return;
        }

        if (current === "" || current === "0") return;
      }

      setDisplayValue(current + value);
    }

    // MỚI: đổi dấu (+/-) cho số cuối cùng đang nhập trong biểu thức.
    function toggleSign() {
      justCalculated = false;

      let current = display.value;

      if (current === "Lỗi") current = "0";

      if (current === "0" || current === "") {
        setDisplayValue("-");
        return;
      }

      // Trường hợp cả biểu thức chỉ là một số âm ở đầu, ví dụ "-5"
      let m = current.match(/^-(\d+\.?\d*)$/);
      if (m) {
        setDisplayValue(m[1]);
        return;
      }

      // Trường hợp số cuối đang được bọc dấu âm dạng "(-5)"
      m = current.match(/\(-(\d+\.?\d*)\)$/);
      if (m) {
        const start = current.length - m[0].length;
        setDisplayValue(current.slice(0, start) + m[1]);
        return;
      }

      // Trường hợp số cuối là số dương, cần chuyển thành âm
      m = current.match(/(\d+\.?\d*)$/);
      if (!m) return; // không có số nào để đổi dấu (vừa bấm toán tử)

      const numStr = m[0];
      const start = current.length - numStr.length;

      if (start === 0) {
        setDisplayValue("-" + numStr);
      } else {
        setDisplayValue(current.slice(0, start) + "(-" + numStr + ")");
      }
    }

    function clearDisplay() {
      justCalculated = false;
      setDisplayValue("0");
    }

    function deleteLast() {
      justCalculated = false;

      let current = display.value;

      if (current === "Lỗi") {
        setDisplayValue("0");
        return;
      }

      if (current.length <= 1) {
        setDisplayValue("0");
        return;
      }

      current = current.slice(0, -1);
      setDisplayValue(current);
    }

    function calculate() {
      // Nếu vừa tính xong và người dùng bấm "=" thêm lần nữa mà chưa
      // nhập gì mới thì bỏ qua, tránh cộng trùng kết quả vào Tổng.
      if (justCalculated) return;

      try {
        const expression = display.value;

        if (!expression || expression === "0") return;

        if (!/^[0-9+\-x:%(). ]+$/.test(expression)) {
          throw new Error("Invalid characters");
        }

        let processed = processPercent(expression);
        processed = processed.replaceAll("x", "*").replaceAll(":", "/");

        let result = eval(processed);

        if (!Number.isFinite(result)) {
          throw new Error("Invalid result");
        }

        const roundedResult = parseFloat(result.toPrecision(12));

        history.unshift({
          expression: expression,
          result: roundedResult
        });

        setDisplayValue(formatNumber(roundedResult));
        justCalculated = true;
        renderHistory();
        updateTotal();
      } catch (error) {
        justCalculated = false;
        setDisplayValue("Lỗi");
        console.warn("Calculation error:", error.message);
      }
    }

    function renderHistory() {
      if (history.length === 0) {
        historyBox.innerHTML =
          '<p class="empty-history">Chưa có phép tính nào.</p>';
        return;
      }

      const total = history.length;
      const showCount = showAllHistory ? total : Math.min(total, 3);
      const itemsToShow = history.slice(0, showCount);

      let html = "";

      itemsToShow.forEach((item, index) => {
        const formattedResult = formatNumber(item.result);

        html += `
          <div class="history-item" data-index="${index}">
            <div>${item.expression}</div>
            <strong>= ${formattedResult}</strong>
          </div>
        `;
      });

      if (total > 3) {
        const label = showAllHistory ? "Thu gọn" : "Xem thêm";
        html += `<button class="show-more-btn" onclick="toggleHistory()">${label}</button>`;
      }

      historyBox.innerHTML = html;

      document.querySelectorAll(".history-item").forEach((el) => {
        const idx = parseInt(el.dataset.index, 10);

        el.addEventListener("click", () => {
          justCalculated = false;
          setDisplayValue(history[idx].expression);
          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });
        });
      });
    }

    function toggleHistory() {
      showAllHistory = !showAllHistory;
      renderHistory();
    }

    function clearHistory() {
      history = [];
      showAllHistory = false;
      renderHistory();
      updateTotal();
    }

    document.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        btn.classList.remove("is-pressed");

        requestAnimationFrame(() => {
          btn.classList.add("is-pressed");

          setTimeout(() => {
            btn.classList.remove("is-pressed");
          }, 180);
        });
      });
    });

    document.addEventListener("keydown", function (e) {
      const key = e.key;

      if ("0123456789+-%.()".includes(key)) {
        appendValue(key);
      } else if (key === "*" || key === "x" || key === "X") {
        appendValue("x");
      } else if (key === "/" || key === ":") {
        appendValue(":");
      } else if (key === "Enter" || key === "=") {
        e.preventDefault();
        calculate();
      } else if (key === "Backspace") {
        deleteLast();
      } else if (key === "Escape") {
        clearDisplay();
      } else if (key === "F9") {
        toggleSign();
      }
    });

    document.addEventListener("dblclick", (e) => e.preventDefault(), {
      passive: false
    });

    setDisplayValue("0");
    updateTotal();
  </script>
</body>
</html>
